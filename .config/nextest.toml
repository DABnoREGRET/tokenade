# The repository's test runner.
#
# nextest runs ONE PROCESS PER TEST: isolation is no longer a discipline (many
# tests mutate `env` or the current directory, which are process-global), it is
# the shape of the run — and every test binary shares one parallel pool.
#
# `test-threads` caps RAM as much as CPU: the suite carries hostile-input probes
# that allocate (see `adversarial_inputs`). Re-measure peak memory before
# raising it.
[profile.default]
test-threads = 6
# A test past two minutes is stuck, not slow.
slow-timeout = { period = "60s", terminate-after = 2 }
failure-output = "immediate-final"


# The fold-recovery ratchets walk the local agent transcripts (~/.claude), whose
# size depends on the machine; give them room instead of calling them stuck.
[[profile.default.overrides]]
filter = "test(/^fold_recovery_ratchet::/)"
slow-timeout = { period = "60s", terminate-after = 6 }

# CI runners have 2–4 cores against the 24 this suite is tuned on; the heavy
# hostile-input and corpus tests need more than two minutes there.
[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 8 }
failure-output = "immediate-final"
fail-fast = false
